name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-check-results
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.REMANGA_KEYSTORE_BASE64 }}
          REMANGA_KEYSTORE_PASSWORD: ${{ secrets.REMANGA_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$REMANGA_KEYSTORE_PASSWORD"
          export REMANGA_KEYSTORE_PATH="$RUNNER_TEMP/remanga-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$REMANGA_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew assembleRelease lintRelease --no-daemon
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/remanga-reader.apk
          cd release
          sha256sum remanga-reader.apk > SHA256SUMS.txt
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/remanga-reader.apk release/SHA256SUMS.txt \
            --verify-tag --title "Remanga Reader $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
