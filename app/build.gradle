plugins {
    id 'com.android.application'
}

def releaseKeyPath = System.getenv('REMANGA_KEYSTORE_PATH')

android {
    namespace 'org.regilios.remangareader'
    compileSdk 36

    defaultConfig {
        applicationId 'org.regilios.remangareader'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        if (releaseKeyPath) {
            release {
                storeFile file(releaseKeyPath)
                storePassword System.getenv('REMANGA_KEYSTORE_PASSWORD')
                keyAlias 'remanga-reader'
                keyPassword System.getenv('REMANGA_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeyPath) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    testImplementation 'junit:junit:4.13.2'
}
